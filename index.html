<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="نظام متكامل لإدارة المتاجر والمخزون — يعمل محلياً بدون إنترنت" />
  <title>نظام إدارة المتجر والمخزون</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

  <!-- Cairo font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- App shell -->
  <div id="app" class="app">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" data-collapsed="false">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M8 13h8"/></svg>
          </span>
          <div class="brand-text">
            <div class="brand-name" id="brandStoreName">متجري</div>
            <div class="brand-sub">نظام الإدارة</div>
          </div>
        </div>
        <button id="sidebarToggle" class="icon-btn" aria-label="طي القائمة" title="طي القائمة">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <nav class="nav" id="mainNav">
        <a class="nav-item active" data-section="dashboard" href="#dashboard">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          <span class="nav-label">لوحة التحكم</span>
        </a>
        <a class="nav-item" data-section="pos" href="#pos">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="nav-label">نقطة البيع</span>
        </a>
        <a class="nav-item" data-section="invoices" href="#invoices">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
          <span class="nav-label">الفواتير</span>
        </a>
        <a class="nav-item" data-section="products" href="#products">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span class="nav-label">المنتجات</span>
        </a>
        <a class="nav-item" data-section="inventory" href="#inventory">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h.01"/><path d="M3 5h18v14H3z"/><path d="M8 7v10M12 7v10M16 7v10"/></svg>
          <span class="nav-label">المخزون</span>
        </a>
        <a class="nav-item" data-section="purchases" href="#purchases">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="nav-label">المشتريات</span>
        </a>
        <a class="nav-item" data-section="customers" href="#customers">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="nav-label">العملاء</span>
        </a>
        <a class="nav-item" data-section="suppliers" href="#suppliers">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          <span class="nav-label">الموردون</span>
        </a>
        <a class="nav-item" data-section="expenses" href="#expenses">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          <span class="nav-label">المصروفات</span>
        </a>
        <a class="nav-item" data-section="alerts" href="#alerts">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="nav-label">التنبيهات</span>
          <span class="badge" id="alertsBadge" hidden>0</span>
        </a>
        <a class="nav-item" data-section="reports" href="#reports">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span class="nav-label">التقارير</span>
        </a>
        <a class="nav-item" data-section="settings" href="#settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="nav-label">الإعدادات</span>
        </a>
      </nav>
    </aside>

    <!-- Mobile overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>

    <!-- Main content -->
    <main class="main" id="main">
      <header class="topbar">
        <button id="mobileMenuBtn" class="icon-btn mobile-only" aria-label="القائمة">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="pageTitle" class="page-title">لوحة التحكم</h1>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" data-action="quick-sale">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>بيع سريع</span>
          </button>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Sections rendered dynamically -->
        <div class="loader-wrap" id="initialLoader">
          <div class="spinner"></div>
          <p>جاري التحميل…</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal container -->
  <div id="modalRoot" class="modal-root" hidden></div>

  <!-- Confirm dialog container -->
  <div id="confirmRoot" class="confirm-root" hidden></div>

  <!-- Print area (separate from app) -->
  <div id="printArea" class="print-area" aria-hidden="true"></div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" onerror="window.__SHEETJS_FAILED__=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" onerror="window.__CHARTJS_FAILED__=true"></script>

  <!-- App scripts -->
  <script src="./js/db.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/import-export.js"></script>
  <script src="./js/pos.js"></script>
  <script src="./js/invoices.js"></script>
  <script src="./js/inventory.js"></script>
  <script src="./js/purchases.js"></script>
  <script src="./js/customers.js"></script>
  <script src="./js/expenses.js"></script>
  <script src="./js/alerts.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/reports.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/backup.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.__SHEETJS_FAILED__) {
        App.toast.warn('تعذّر تحميل مكتبة Excel (SheetJS). استيراد وتصدير Excel قد لا يعمل دون اتصال بالإنترنت.');
      }
      if (window.__CHARTJS_FAILED__) {
        App.toast.warn('تعذّر تحميل مكتبة الرسوم البيانية (Chart.js). قد لا تظهر الرسوم بيانية.');
      }
      App.init();
    });
  </script>
</body>
</html>
